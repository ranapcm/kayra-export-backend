services:
  postgres:
    image: postgres:15-alpine
    container_name: kayra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kayra_export_db
      POSTGRES_USER: kayra_user
      POSTGRES_PASSWORD: kayra_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayra_user -d kayra_export_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:15-alpine
    container_name: kayra-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kayra_auth_db
      POSTGRES_USER: kayra_auth_user
      POSTGRES_PASSWORD: kayra_auth_dev_password
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U kayra_auth_user -d kayra_auth_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kayra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  auth_postgres_data:
  redis_data: