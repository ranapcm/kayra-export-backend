name: KayraExport CI

on:
  push:
    branches:
      - main
      - test/v1.0.0
      - prod/v1.0.0
  pull_request:
    branches:
      - main
      - test/v1.0.0
      - prod/v1.0.0

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore KayraExport.sln

      - name: Build solution
        run: dotnet build KayraExport.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test KayraExport.sln --configuration Release --no-build --verbosity normal